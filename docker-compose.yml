services:
  postgres:
    networks: [data]
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: nocturno
      POSTGRES_USER: nocturno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nocturno_local_only}
    volumes:
      - nocturno_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocturno -d nocturno"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    networks: [data, catalog]
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 3000
      CORE_HOST: 0.0.0.0
      DATABASE_URL: postgresql://nocturno:${POSTGRES_PASSWORD:-nocturno_local_only}@postgres:5432/nocturno
      CORS_ORIGIN: http://localhost:4200
      FRONTEND_URL: http://localhost:4200
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in root .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in root .env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed && npm start"]
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  ai:
    build: ./backend
    command: ["node", "ai/server.js"]
    environment:
      AI_HOST: 0.0.0.0
      YOMOGAN_CORE_URL: http://backend:3000
      YOMOGAN_CHAT_URL: http://host.docker.internal:11434
      YOMOGAN_EMBED_URL: http://host.docker.internal:11434
    expose: ["3001"]
    networks: [catalog]
  gateway:
    build: ./backend
    command: ["node", "gateway/server.js"]
    environment:
      GATEWAY_HOST: 0.0.0.0
      CORE_URL: http://backend:3000
      AI_URL: http://ai:3001
    expose: ["8080"]
    networks: [catalog, edge]

  frontend:
    networks: [edge]
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:4200:80"

volumes:
  nocturno_pgdata:

networks:
  data:
    internal: true
  catalog: {}
  edge: {}
