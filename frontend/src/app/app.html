<app-header
  [municipality]="location.municipality()"
  [municipalities]="location.municipalities()"
  (locationChanged)="changeLocation($event)"
/>
<main id="main-content"><router-outlet /></main>
<footer class="site-footer">
  <div class="page-width footer-inner">
    <strong>NOCTURNO.</strong><span>Descubre la noche a tu manera.</span><span>© {{ year }}</span>
    <button type="button" class="footer-cookie-button" (click)="cookies.openPreferences()">Preferencias de cookies</button>
  </div>
</footer>

<app-cookie-preferences #cookies />
<app-yomogan-chat [available]="!!cookies.choice()" [open]="yomogan.open()"
  [messages]="yomogan.messages()" [pending]="yomogan.pending()" [error]="yomogan.error()"
  [avatarUrl]="yomogan.avatarUrl()" (openChanged)="yomogan.setOpen($event)"
  (messageSent)="yomogan.send($event)" (retryRequested)="yomogan.retry()"
  (conversationReset)="yomogan.newConversation()" />
