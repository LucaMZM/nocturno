# Do not log Stripe return query parameters, client secrets or referrers.
log_format nocturno_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
  listen 80;
  server_name _;
  access_log /var/log/nginx/access.log nocturno_safe;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://backend:3000;
  }

  location / {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://js.stripe.com https://*.js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.stripe.com https://*.stripe.network https://*.link.com; frame-src https://*.stripe.com https://*.stripe.network https://*.link.com" always;
    try_files $uri $uri/ /index.html;
  }
}
