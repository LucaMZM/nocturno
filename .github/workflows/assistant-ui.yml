name: Assistant UI

on:
  push:
    branches: [main]
    paths: ['frontend/src/app/features/cookies/**', 'frontend/src/app/features/yomogan/**', 'frontend/tools/test-assistant-ui.mjs', '.github/workflows/assistant-ui.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_DB: nocturno_capture
          POSTGRES_USER: nocturno_capture
          POSTGRES_PASSWORD: capture_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nocturno_capture -d nocturno_capture"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      YOMOGAN_TIMEOUT_MS: '180000'
      NODE_ENV: development
      DATABASE_URL: postgresql://nocturno_capture:capture_only_password@localhost:5432/nocturno_capture
      CORS_ORIGIN: http://localhost:4200
      FRONTEND_URL: http://localhost:4200
      JWT_ACCESS_SECRET: capture-only-access-secret-never-use-outside-ci
      JWT_REFRESH_SECRET: capture-only-refresh-secret-never-use-outside-ci
      DEMO_USER_EMAIL: user@nocturno.test
      DEMO_USER_PASSWORD: UserDemo!2026
      DEMO_ADMIN_EMAIL: admin@nocturno.test
      DEMO_ADMIN_PASSWORD: AdminDemo!2026
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install, migrate and seed backend
        working-directory: backend
        run: |
          npm ci
          npm run db:migrate
          npm run db:seed
      - name: Install frontend and isolated Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start API and Angular in runner
        run: |
          npm --prefix backend start > /tmp/nocturno-api.log 2>&1 &
          npm --prefix frontend start -- --host 127.0.0.1 --port 4200 > /tmp/nocturno-angular.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:3000/health > /dev/null && curl --fail --silent http://localhost:4200/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/nocturno-api.log /tmp/nocturno-angular.log
          exit 1
      - name: Capture real application views
        working-directory: frontend
        run: node tools/test-assistant-ui.mjs
      - name: Verify existing public and ticketing flows
        working-directory: frontend
        run: node tools/capture-screenshots.mjs
      - name: Verify event deletion impact dialog
        working-directory: frontend
        run: node tools/test-event-deletion-ui.mjs
      # Dependency changes are covered by package-lock; script-only changes do not require model downloads.
      - name: Detect changes requiring real model verification
        id: ai-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD -- backend/src/services/yomogan\* backend/src/repositories/yomogan\* backend/src/validators/yomogan\* backend/src/db/migrations backend/tools/verify-yomogan-live.js backend/package-lock.json frontend/src/app/features/yomogan | grep -q .; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          elif git diff "$BASE_SHA" HEAD -- backend/src/config/env.js | grep -E '^[+-].*YOMOGAN_(PROVIDER|CHAT_URL|MODEL|EMBED_|TIMEOUT_MS)' >/dev/null; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Start isolated real Ollama
        if: steps.ai-scope.outputs.live == 'true'
        run: |
          docker run -d --name yomogan-ollama -p 127.0.0.1:11434:11434 -e OLLAMA_MAX_LOADED_MODELS=1 -e OLLAMA_NUM_PARALLEL=1 ollama/ollama:0.40.7
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 2
          done
          docker exec yomogan-ollama ollama pull qwen3:4b
          docker exec yomogan-ollama ollama pull embeddinggemma
      - name: Test real generation and embeddings
        if: steps.ai-scope.outputs.live == 'true'
        working-directory: backend
        env:
          YOMOGAN_TIMEOUT_MS: '180000'
        run: node tools/verify-yomogan-live.js
      - name: Test real AI through Angular and HTTP
        if: steps.ai-scope.outputs.live == 'true'
        working-directory: frontend
        run: node tools/test-assistant-ui.mjs --live
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nocturno-assistant-ui
          path: |
            docs/screenshots/assistant/*.png
            docs/screenshots/integrity/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Show server logs on failure
        if: failure()
        run: |
          cat /tmp/nocturno-api.log /tmp/nocturno-angular.log
          docker logs yomogan-ollama || true
          docker inspect --format '{{.State.OOMKilled}} {{.State.ExitCode}}' yomogan-ollama || true
