name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/auth-cookie-security', 'codex/shop-catalogo']

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and syntax
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_DB: nocturno_ci
          POSTGRES_USER: nocturno_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nocturno_ci -d nocturno_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nocturno_ci:ci_only_password@localhost:5432/nocturno_ci
      CORS_ORIGIN: http://localhost:4200
      FRONTEND_URL: http://localhost:4200
      JWT_ACCESS_SECRET: ci-only-access-secret-replace-outside-ci
      JWT_REFRESH_SECRET: ci-only-refresh-secret-replace-outside-ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
      - run: npm run check
      - run: npm run db:audit
      - name: Verificar el supervisor con la base efímera
        working-directory: .
        run: |
          npm ci --prefix frontend
          trap 'npm run down' EXIT
          npm run up
          npm run up
          curl -fsS http://localhost:3000/health | jq -e '.status == "ok"'
          curl -fsS http://localhost:4000/api/config/events | jq -e '.data.maxImages > 0'
          curl -fsS -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"Hola"}]}' http://localhost:4200/api/yomogan/chat | jq -e '.data.message'
          GATEWAY_PORT=4100 npm run restart
          curl -fsS http://localhost:4100/api/config/events | jq -e '.data.maxImages > 0'
          curl -fsS http://localhost:4200/api/config/events | jq -e '.data.maxImages > 0'
          npm run down
          if curl -fsS http://localhost:4100/api/config/events; then exit 1; fi

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    name: Arranque de Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      JWT_ACCESS_SECRET: compose-test-access-secret-only-for-ephemeral-ci
      JWT_REFRESH_SECRET: compose-test-refresh-secret-only-for-ephemeral-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Comprobar Angular, catálogo e IA a través de nginx y Gateway
        run: |
          curl -fsS http://localhost:4200/ | grep -q '<app-root'
          curl -fsS http://localhost:4200/api/shop/events | jq -e '.data | length > 0'
          curl -fsS http://localhost:4200/api/yomogan/config | jq -e '.data'
      - if: always()
        run: docker compose down --volumes
